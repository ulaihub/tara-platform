<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "clair"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'encours' };
  }
  vals() {
    const tab = this.state.tab;
    const I = {
      box: 'M3 7.5L12 3l9 4.5v9L12 21l-9-4.5zM3 7.5L12 12l9-4.5M12 12v9',
      nav: 'M3 11l18-8-8 18-2-8z',
      alert: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 8v5M12 16.5v.5',
      clock: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 7v5l3 2',
      check: 'M5 12.5l4.5 4.5L19 7.5',
      back: 'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',
      close: 'M6 6l12 12M18 6L6 18',
    };
    const orange = { ring: 'url(#co-grad)', ink: 'var(--accent)', statusColor: 'rgba(var(--fg-rgb),.70)' };
    const green = { ring: '#10A06E', ink: 'var(--ok)', statusColor: 'var(--ok)' };
    const red = { ring: '#FF2D3D', ink: 'var(--danger)', statusColor: 'var(--danger)' };
    const grey = { ring: 'rgba(var(--fg-rgb),.30)', ink: 'rgba(var(--fg-rgb),.62)', statusColor: 'rgba(var(--fg-rgb),.66)' };
    const pct = (p) => `${Math.round(113 - (113 * p) / 100)}`;
    const groups =
      tab === 'encours'
        ? [
            {
              day: "Aujourd'hui",
              rows: [
                { who: 'Marie Ngo · Collège des Nations', status: 'En livraison · 4 min', ref: 'TR-48211', amount: '15 000 F', icon: I.box, offset: pct(76), ...orange },
                { who: 'n° 2 · Jean Mbarga · Carrefour Ndokoti', status: 'Livreur en route vers vous', ref: 'TR-48212', amount: '1 200 F', icon: I.nav, offset: pct(25), ...orange },
                { who: 'Chantal Eyike · Carrefour Nkongmondo', status: 'Livraison impossible · à décider', ref: 'TR-48213', amount: '8 000 F', icon: I.alert, offset: pct(100), ...red },
              ],
            },
            {
              day: 'Demain',
              rows: [{ who: 'Samuel Etoa · Rond-point Deïdo', status: 'Prévue à 09:30', ref: 'TR-48214', amount: '1 500 F', icon: I.clock, offset: pct(5), ...grey }],
            },
          ]
        : [
            {
              day: "Aujourd'hui",
              rows: [
                { who: 'Paul Ekwalla · Carrefour Kotto', status: 'Livrée à 13:58', ref: 'TR-48208', amount: '12 250 F', icon: I.check, offset: pct(100), ...green },
                { who: 'Rose Mballa · La Pagode', status: 'Livrée à 11:05', ref: 'TR-48207', amount: '9 800 F', icon: I.check, offset: pct(100), ...green },
              ],
            },
            {
              day: 'Hier',
              rows: [
                { who: 'Brice Nana · Stade de Japoma', status: 'Retournée à la boutique', ref: 'TR-48199', amount: '1 000 F', icon: I.back, offset: pct(100), ...orange },
                { who: 'Lydie Fotso · Marché Central', status: 'Annulée avant l’enlèvement', ref: 'TR-48196', amount: '0 F', icon: I.close, offset: pct(100), ...grey },
              ],
            },
          ];
    const tabs = [
      ['encours', 'En cours · 4'],
      ['terminees', 'Terminées'],
    ].map(([key, label]) => ({
      label,
      selected: key === tab ? 'true' : 'false',
      pick: () => this.setState({ tab: key }),
      bg: key === tab ? 'var(--sheet)' : 'transparent',
      shadow: key === tab ? '0 4px 12px rgba(140,70,10,.12)' : 'none',
      ink: key === tab ? '#140800' : 'rgba(var(--fg-rgb),.70)',
    }));
    return {
      tabs,
      tabIdx: tab === 'encours' ? 0 : 1,
      summary: tab === 'encours' ? '4 en cours · 1 à décider' : 'Cette semaine : 42 livraisons · 96 % réussies',
      groups: groups.map((g) => ({
        ...g,
        rows: g.rows.map((r, i) => ({
          ...r,
          ...(() => { const i = (r.who || '').lastIndexOf(' · '); return { name: i < 0 ? r.who : r.who.slice(0, i), place: i < 0 ? '' : r.who.slice(i + 3) }; })(),
          receiptLabel: `Reçu de ${r.ref}`,
          border: i === g.rows.length - 1 ? '0' : '1px solid rgba(var(--fg-rgb),.07)',
        })),
      })),
    };

  renderVals() {

    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'clair';
