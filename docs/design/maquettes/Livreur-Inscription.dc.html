<div style="position: absolute; left: 20px; right: 20px; top: 96px; bottom: 20px; display: flex; flex-direction: column; gap: 12px"><span style="display: block; height: 6px; border-radius: 3px; background: rgba(var(--fg-rgb),.10); overflow: hidden"><span class="tara-anim" style="display: block; height: 6px; width: 50%; border-radius: 3px; background: linear-gradient(90deg, #FFB000, #FF6A00, #FF3D00, #FF6A00, #FFB000); background-size: 200% 100%; animation: lq-flow 2.6s linear infinite; transition: width .5s"></span></span><label style="min-height: 56px; padding: 8px 14px; border-radius: 16px; background: rgba(var(--fg-rgb),.06); border: 1px solid rgba(var(--fg-rgb),.14); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; color: rgba(var(--fg-rgb),.62)">Nom complet</span><b style="font-size: 16px">Jean Mbarga</b></label><span style="font-size: 13px; font-weight: 800; color: rgba(var(--fg-rgb),.8)">Véhicule</span><div role="radiogroup" aria-label="Véhicule" style="position: relative; padding: 4px; border-radius: 17px; background: rgba(var(--fg-rgb),.07); border: 1px solid rgba(var(--fg-rgb),.10); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))"><span aria-hidden="true" style="position: absolute; top: 4px; bottom: 4px; left: calc(4px + (100% - 8px) / 3 * {{vehIdx}}); width: calc((100% - 8px) / 3); border-radius: 13px; background: linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%); box-shadow: 0 6px 16px rgba(255,90,0,.35); transition: left .5s cubic-bezier(.6,-.35,.3,1.45)"></span><sc-for list="{{vehicles}}" as="v" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{v.checked}}" onClick="{{v.pick}}" style="position: relative; min-height: 50px; border: 0; background: transparent; color: {{v.ink}}; font-size: 14px; font-weight: 800; cursor: pointer; transition: color .3s">{{v.label}}</button></sc-for></div><label style="min-height: 56px; padding: 8px 14px; border-radius: 16px; background: rgba(var(--fg-rgb),.06); border: 1px solid rgba(var(--fg-rgb),.14); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; color: rgba(var(--fg-rgb),.62)">{{plateLabel}}</span><b style="font-size: 16px">{{plate}}</b><span style="font-size: 11px; color: rgba(var(--fg-rgb),.5)">Ex. LT 123 AB</span></label><label style="min-height: 56px; padding: 8px 14px; border-radius: 16px; background: rgba(var(--fg-rgb),.06); border: 1px solid rgba(var(--fg-rgb),.14); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; color: rgba(var(--fg-rgb),.62)">Téléphone du garant</span><b style="font-size: 16px">6 90 •• •• 12</b><span style="font-size: 11px; color: rgba(var(--fg-rgb),.5)">Une personne qui se porte garante de vous</span></label><span style="font-size: 13px; font-weight: 800; color: rgba(var(--fg-rgb),.8)">Contact d’urgence (facultatif)</span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><label style="min-height: 56px; padding: 8px 14px; border-radius: 16px; background: rgba(var(--fg-rgb),.06); border: 1px solid rgba(var(--fg-rgb),.14); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; color: rgba(var(--fg-rgb),.62)">Nom du contact</span><b style="font-size: 16px">Paul Mbarga</b></label><label style="min-height: 56px; padding: 8px 14px; border-radius: 16px; background: rgba(var(--fg-rgb),.06); border: 1px solid rgba(var(--fg-rgb),.14); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; color: rgba(var(--fg-rgb),.62)">Téléphone</span><b style="font-size: 16px">6 99 •• •• 21</b></label></div><span style="font-size: 12px; color: rgba(var(--fg-rgb),.66)">P <script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "sombre"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { veh: 'Moto' };
  }
  vals() {
    const veh = this.state.veh;
    const list = ['Moto', 'Voiture', 'Tricycle'];
    return {
      vehIdx: list.indexOf(veh),
      vehicles: list.map((label) => ({ label, checked: label === veh ? 'true' : 'false', ink: label === veh ? '#140800' : 'rgba(var(--fg-rgb),.78)', pick: () => this.setState({ veh: label }) })),
      plateLabel: 'Immatriculation', plate: veh === 'Moto' ? 'LT 482 KA' : veh === 'Voiture' ? 'LT 915 CE' : 'LT 207 TR',
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'sombre';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
