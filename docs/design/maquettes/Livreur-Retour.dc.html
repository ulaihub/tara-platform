<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "sombre"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, returned: false };
  }
  vals() {

    const slider = (enabled, done, idleText, doneText, label, onSlide) => ({
      slide: onSlide,
      slideLabel: label,
      slideText: done ? doneText : idleText,
      trackBg: enabled || done ? 'rgba(var(--fg-rgb),.10)' : 'rgba(var(--fg-rgb),.05)',
      trackInk: done ? '#140800' : enabled ? 'var(--ink)' : 'rgba(var(--fg-rgb),.40)',
      knobLeft: done ? 'calc(100% - 57px)' : '5px',
      knobBg: done ? '#140800' : enabled ? 'linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)' : 'rgba(var(--fg-rgb),.12)',
      knobInk: done ? '#FFB000' : enabled ? '#140800' : 'rgba(var(--fg-rgb),.40)',
      fillW: done ? '100%' : '0%',
      padL: done ? '18px' : '64px',
      padR: done ? '66px' : '18px',
      chevShow: done ? 'none' : 'flex',
      checkShow: done ? 'flex' : 'none',
    });
    const { step, returned } = this.state;
    const next = () => this.setState({ step: Math.min(4, step + 1) });
    const defs = [
      ['Rejoindre le vendeur', 'Boutique Awa · Bd de la Liberté', 'Je suis arrivé'],
      ['Frais de retour à encaisser', 'Awa Fashion règle 600 F avant de récupérer son colis : c’est ce que son Solde Tara ne couvre pas.', ''],
      ['Saisir le code de retour', 'Reçu par SMS par le vendeur', 'Taper le code'],
      ['Photographier le colis rendu', 'Colis entre les mains du vendeur', 'Prendre'],
    ];
    const steps = defs.map(([title, sub, action], i) => {
      const doneStep = i < step;
      const current = i === step;
      return {
        mark: doneStep ? '✓' : String(i + 1),
        title: doneStep && i === 1 ? 'Frais de retour réglés' : title,
        sub: doneStep && i === 1 ? 'Vous pouvez rendre le colis.' : doneStep && i === 2 ? 'Code 7 2 1 5 vérifié' : doneStep && i === 3 ? 'Photo du retour · prise à 16:12' : sub,
        hasAction: current && action !== '',
        action, act: next,
        feeOpen: current && i === 1,
        bg: current ? 'rgba(255,138,0,.08)' : 'rgba(var(--fg-rgb),.05)',
        border: current ? 'rgba(255,138,0,.45)' : 'rgba(var(--fg-rgb),.10)',
        dot: doneStep ? '#10A06E' : current ? 'linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)' : 'rgba(var(--fg-rgb),.10)',
        dotInk: doneStep ? '#FFF' : current ? '#140800' : 'rgba(var(--fg-rgb),.6)',
      };
    });
    return {
      steps,
      feeCash: next,
      feeMomo: next,
      returned,
      ...slider(step === 4, returned, 'Glisser · Colis rendu', 'Colis rendu · retour payé', 'Confirmer : colis rendu', () => { if (step === 4) this.setState({ returned: !returned }); }),
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'sombre';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
