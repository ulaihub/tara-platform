<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "sombre"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { reason: 'Client absent', photo: false, done: false };
  }
  vals() {

    const radio = (list, current, set) => list.map((label) => ({
      label, checked: label === current ? 'true' : 'false',
      border: label === current ? '#FF8A00' : 'rgba(var(--fg-rgb),.16)',
      bg: label === current ? 'rgba(255,138,0,.12)' : 'rgba(var(--fg-rgb),.05)',
      dot: label === current ? '#FF8A00' : 'transparent',
      pick: () => set(label),
    }));
    const photoVals = (has, title, takenTitle, hint) => ({
      photo: () => this.setState({ photo: !has }),
      photoBg: has ? 'rgba(74,222,155,.08)' : 'rgba(var(--fg-rgb),.06)',
      photoBorder: has ? 'rgba(74,222,155,.35)' : 'rgba(255,177,92,.45)',
      photoIcon: has ? 'var(--ok)' : 'var(--accent)',
      photoTitle: has ? takenTitle : title,
      photoHint: hint,
      photoAction: has ? 'Reprendre' : 'Prendre',
    });
    const btn = (enabled, label, onClick) => ({
      label, onClick,
      bg: enabled ? 'linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)' : 'rgba(var(--fg-rgb),.08)',
      ink: enabled ? '#140800' : 'rgba(var(--fg-rgb),.42)',
    });
    const { reason, photo, done } = this.state;
    const damaged = reason === 'Colis abîmé, refusé';
    const ready = photo && !done;
    return {
      open: !done, done,
      reasons: radio(['Client absent', 'Injoignable', 'Adresse introuvable', 'Refuse le colis', 'Colis abîmé, refusé', 'Lieu dangereux'], reason, (r) => this.setState({ reason: r, photo: false })),
      ...photoVals(photo, damaged ? 'Photo du colis abîmé · obligatoire' : 'Photo du lieu · obligatoire',
        damaged ? 'Photo du colis abîmé · prise à 15:31' : 'Photo du lieu · prise à 15:31',
        damaged ? 'Le dommage bien visible' : 'Porte, portail ou devanture visible'),
      noteHint: damaged ? 'Ex. carton écrasé, bouteille cassée' : 'Ex. portail fermé, chien dangereux',
      notice: damaged
        ? 'Photographiez le dommage et décrivez-le : l’équipe Tara ouvre une réclamation pour l’expéditeur.'
        : 'L’expéditeur est prévenu tout de suite et choisit : nouvelle tentative ou retour.',
      doneTitle: 'Échec enregistré',
      doneBody: 'L’expéditeur choisit : nouvelle tentative ou retour. Gardez le colis avec vous.',
      act: done ? btn(false, 'En attente de l’expéditeur…', () => {}) : btn(ready, 'Déclarer l’échec', () => { if (ready) this.setState({ done: true }); }),
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'sombre';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
