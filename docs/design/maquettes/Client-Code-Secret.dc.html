@keyframes r-radar{0%{transform:scale(.3);opacity:.75}100%{transform:scale(3.2);opacity:0}}@keyframes r-dash{to{stroke-dashoffset:-28}}@keyframes r-blink{0%,100%{opacity:1}50%{opacity:.35}}@keyframes r-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes r-turn{to{transform:rotate(360deg)}}@keyframes r-rise{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}@keyframes r-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

@keyframes am-rise{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}@keyframes am-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; position: relative; overflow: hidden; {{themeVars}}">

<div style="position: relative; padding: 18px 20px 0; display: flex; align-items: center; gap: 10px"><a href="Client-Bienvenue.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: inherit; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="font-family: Sora, sans-serif; font-size: 18px">{{title}}</b></span></div>
<div style="position: absolute; left: 24px; right: 24px; top: 96px; bottom: 24px; display: flex; flex-direction: column; gap: 16px"><span style="font-size: 14px; line-height: 1.5; color: rgba(var(--fg-rgb),.76)">4 chiffres, comme pour Orange Money ou MoMo. Il protège votre solde et vos retraits. Ne le donnez à personne, même à Tara.</span><div style="display: flex; justify-content: center; gap: 16px; padding: 8px 0"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width: 18px; height: 18px; border-radius: 50%; border: 2px solid #FF8A00; background: {{d.fill}}; transition: background .2s"></span></sc-for></div><span style="text-align: center; font-size: 13px; font-weight: 700; color: {{msgInk}}">{{msg}}</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" style="height: 58px; border-radius: 16px; border: 1px solid var(--card-border); background: var(--card); color: inherit; font: 700 22px Sora, sans-serif; cursor: pointer">{{k.label}}</button></sc-for></div><button type="button" onClick="{{bio}}" aria-pressed="{{bioAria}}" style="padding: 12px 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--card-border); box-shadow: 0 12px 28px rgba(140,70,10,.08); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); color: inherit; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer"><span style="position: relative; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,177,92,.14); overflow: hidden; display: flex; align-items: center; justify-content: center"><sc-if value="{{bioOn}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; border-radius: 12px; overflow: hidden; pointer-events: none" aria-hidden="true"><span class="tara-anim" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: translateY(30%); transition: transform 1s linear"><span class="tara-anim" style="position: absolute; left: 0; top: -12px; width: 80px; height: 60px; animation: lq-move-r 8s linear infinite"><svg width="80" height="60" viewBox="0 0 80 60" style="display: block"><path d="M0 7.1 L3 7.1 L6 6.4 L9 5.1 L12 3.4 L15 1.8 L18 0.6 L21 0.0 L24 0.2 L27 1.2 L30 2.6 L33 4.3 L36 5.8 L39 6.9 L42 7.2 L45 6.7 L48 5.6 L51 4.0 L54 2.3 L57 0.9 L60 0.1 L63 0.1 L66 0.8 L69 2.1 L72 3.8 L75 5.4 L78 6.6 L80 60 L0 60 Z" style="fill: var(--lq-back, rgba(255,61,0,.5))"></path></svg></span><span class="tara-anim" style="position: absolute; left: 0; top: -3px; width: 80px; height: 60px; animation: lq-move 5s linear infinite"><svg width="80" height="60" viewBox="0 0 80 60" style="display: block"><defs><linearGradient id="lqBio" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="80"><stop offset="0" stop-color="#FFB000"></stop><stop offset="0.18" stop-color="#FF6A00"></stop><stop offset="0.5" stop-color="#FF3D00"></stop></linearGradient></defs><path d="M0 3.0 L3 4.4 L6 5.4 L9 6.0 L12 5.9 L15 5.1 L18 3.9 L21 2.5 L24 1.2 L27 0.3 L30 0.0 L33 0.3 L36 1.2 L39 2.5 L42 3.9 L45 5.1 L48 5.9 L51 6.0 L54 5.4 L57 4.4 L60 3.0 L63 1.6 L66 0.6 L69 0.0 L72 0.1 L75 0.9 L78 2.1 L80 60 L0 60 Z" fill="url(#lqBio)"></path></svg></span></span></span></sc-if><span style="position: relative; display: flex; color: var(--accent)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10a5 5 0 0 1 10 0v2M9.5 21c-.8-1.5-1.5-3.5-1.5-6V10a4 4 0 0 1 8 0v5M12 10v6c0 2 .6 3.6 1.5 5M16 15c0 2 .3 3.4 1 4.5"></path></svg></span></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14px">Utiliser aussi mon empreinte</b><span style="font-size: 12px; color: rgba(var(--fg-rgb),.62)">Confirmer avec l’empreinte au lieu du code</span></span><span style="position: relative; width: 48px; height: 28px; border-radius: 14px; background: {{switchBg}}; transition: background .3s"><span style="position: absolute; top: 3px; left: {{knob}}; width: 22px; height: 22px; border-radius: 50%; background: #FFF; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: left .35s cubic-bezier(.6,-.35,.3,1.45)"></span></span></button><sc-if value="{{saved}}" hint-placeholder-val="{{ false }}"><a href="Accueil.dc.html" style="height: 58px; border-radius: 20px; background: linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%); box-shadow: 0 14px 30px rgba(255,90,0,.3); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #140800; font-size: 16px; font-weight: 800">Code secret enregistré · continuer</a></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "clair"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { first: null, pin: '', bio: true, saved: false, err: false };
  }
  vals() {
    const { first, pin, bio } = this.state;
    const confirming = first !== null;
    const saved = this.state.saved;
    return {
      title: saved ? 'Code secret enregistré' : confirming ? 'Confirmez votre code secret' : 'Choisissez votre code secret',
      dots: [0, 1, 2, 3].map((i) => ({ fill: i < pin.length || saved ? '#FF8A00' : 'transparent' })),
      msg: this.state.err ? 'Les deux codes sont différents. Recommencez.' : saved ? 'Il vous sera demandé pour voir votre solde et retirer.' : `${pin.length} chiffre(s) sur 4`,
      msgInk: this.state.err ? '#FF8A3D' : 'rgba(var(--fg-rgb),.62)',
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => ({
        label: k, aria: k === '⌫' ? 'Effacer' : k || 'vide',
        press: () => {
          if (saved || !k) return;
          if (k === '⌫') return this.setState({ pin: pin.slice(0, -1), err: false });
          const next = pin + k;
          if (next.length < 4) return this.setState({ pin: next, err: false });
          if (!confirming) return this.setState({ first: next, pin: '', err: false });
          if (next === first) return this.setState({ pin: next, saved: true });
          return this.setState({ first: null, pin: '', err: true });
        },
      })),
      bio: () => this.setState({ bio: !bio }), bioAria: bio ? 'true' : 'false', bioOn: bio,
      switchBg: bio ? 'linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)' : 'rgba(var(--fg-rgb),.18)', knob: bio ? '23px' : '3px',
      saved,
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'clair';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
