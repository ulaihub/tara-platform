    const frontT = 'translateX(0px) translateY(0px) rotateY(0deg) rotateZ(0deg) translateZ(0px)';
    const swaps = this.state.swaps;
    const anim = (toFront) => (swaps === 0 ? 'none' : `${toFront ? 'w3-toFront' : 'w3-toBack'} .75s cubic-bezier(.6,0,.3,1) both`);
    const plus = 'M12 5v14M5 12h14';
    const up = 'M7 17L17 7M9 7h8v8';
    const doc = 'M7 3h7l4 4v14H7zM14 3v4h4';
    const send = 'M21 3L3 10.5l7.5 3L14 21zM10.5 13.5L21 3';
    const shield = 'M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z';
    const box = 'M3 7.5L12 3l9 4.5v9L12 21l-9-4.5zM3 7.5L12 12l9-4.5M12 12v9';
    const accent = { bg: 'rgba(255,138,0,.14)', ink: 'var(--accent)' };
    const green = { bg: 'rgba(14,127,87,.12)', ink: 'var(--ok)' };
    const neutral = { bg: 'rgba(var(--fg-rgb),.06)', ink: 'var(--ink)' };
    const primary = { bg: gradient, ink: '#140800', shadow: '0 10px 22px rgba(255,90,0,.30)' };
    const secondary = { bg: 'var(--sheet)', ink: 'var(--ink)', shadow: '0 8px 20px rgba(140,70,10,.10)' };
    const actions = ventesFront
      ? [
          { label: 'Recevoir', icon: send, href: 'Recevoir.dc.html', ...primary },
          { label: 'Réserve', icon: shield, href: 'Reserve.dc.html', ...secondary },
          { label: 'Relevé', icon: doc, href: '#', ...secondary },
        ]
      : [
          { label: 'Recharger', icon: plus, href: '#', ...primary },
          { label: 'Retirer', icon: up, href: '#', ...secondary },
          { label: 'Relevé', icon: doc, href: '#', ...secondary },
        ];
    const rows = ventesFront
      ? [
          { title: 'Vente encaissée', sub: 'Marie Ngo · TR-48211 · 14:32', amount: '+12 250 F', amountColor: 'var(--ok)', icon: box, ...green },
          { title: 'Vente encaissée', sub: 'Samuel Etoa · TR-48212 · 11:05', amount: '+9 800 F', amountColor: 'var(--ok)', icon: box, ...green },
          { title: 'Frais d’échec', sub: 'Client absent · TR-48213', amount: '−750 F', amountColor: 'var(--ink)', icon: box, ...neutral },
          { title: 'Reversement', logo: 'om', sub: 'Orange Money ••56 · hier 18:02', amount: '−86 000 F', amountColor: 'var(--ink)', icon: up, ...accent },
        ]
      : [
          { title: 'Recharge', logo: 'mtn', sub: 'MTN MoMo · lundi', amount: '+5 000 F', amountColor: 'var(--ok)', icon: plus, ...green },
          { title: 'Livraison payée', sub: 'Chantal Eyike · TR-48214', amount: '−1 500 F', amountColor: 'var(--ink)', icon: box, ...neutral },
        ];
    return {
      masked,
      shown: !masked,
      eyeLabel: masked ? 'Afficher les montants' : 'Masquer les montants',
      toggleMask: () => this.setState({ masked: !masked }),
      swap: () => this.setState({ front: ventesFront ? 'tara' : 'ventes', swaps: swaps + 1 }),
      ventesAnim: anim(ventesFront),
      taraAnim: anim(!ventesFront),
      rx: this.state.rx.toFixed(1),
      ry: this.state.ry.toFixed(1),
      px: this.state.px.toFixed(0),
      py: this.state.py.toFixed(0),
      tilt: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
        this.setState({ rx: 7 + (0.5 - y) * 14, ry: (x - 0.5) * 24, px: x * 100, py: y * 100 });
      },
      untilt: () => this.setState({ rx: 7, ry: -9, px: 30, py: 20 }),
      ventes: hide('128 500 F'),
      tara: hide('3 500 F'),
      ventesLabel: ventesFront ? 'Ventes à recevoir, au premier plan' : 'Mettre les ventes à recevoir au premier plan',
      taraLabel: ventesFront ? 'Mettre le Solde Tara au premier plan' : 'Solde Tara, au premier plan',
      ventesTransform: ventesFront ? frontT : backT,
      taraTransform: ventesFront ? backT : frontT,
      ventesZ: ventesFront ? 2 : 1,
      taraZ: ventesFront ? 1 : 2,
      ventesOpacity: ventesFront ? 1 : 0.9,
      taraOpacity: ventesFront ? 0.9 : 1,
      dotVentes: ventesFront ? '26px' : '8px',
      dotTara: ventesFront ? '8px' : '26px',
      dotVentesBg: ventesFront ? gradient : 'rgba(var(--fg-rgb),.18)',
      dotTaraBg: ventesFront ? 'rgba(var(--fg-rgb),.18)' : gradient,
      actions,
      moves: rows.map((row, i) => ({ ...row, om: row.logo === 'om', mtn: row.logo === 'mtn', noLogo: !row.logo, border: i === rows.length - 1 ? '0' : '1px solid rgba(var(--fg-rgb),.08)' })),
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'clair';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
