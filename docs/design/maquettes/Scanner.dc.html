<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scanner le code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Sora:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes tara-scanline{0%,100%{top:14px}50%{top:226px}}
@keyframes tara-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes tara-pop{0%{transform:perspective(400px) rotateY(-180deg) scale(.3);opacity:0}70%{transform:perspective(400px) rotateY(20deg) scale(1.12);opacity:1}100%{transform:perspective(400px) rotateY(0deg) scale(1);opacity:1}}
@keyframes tara-ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes tara-sway{0%,100%{transform:perspective(800px) translate(0px,0px) rotateX(16deg) rotateY(-20deg) rotateZ(-5deg)}50%{transform:perspective(800px) translate(4px,-3px) rotateX(10deg) rotateY(-9deg) rotateZ(-3deg)}}
@keyframes lq-move{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes lq-move-r{from{transform:translateX(-50%)}to{transform:translateX(0)}}@keyframes lq-move-y{from{transform:translateY(0)}to{transform:translateY(-50%)}}@keyframes lq-drain{from{transform:translateY(0%)}to{transform:translateY(100%)}}@keyframes lq-fill-x{0%{width:0%}85%,100%{width:100%}}@keyframes lq-flow{from{background-position:0% 0}to{background-position:-200% 0}}@keyframes lq-morph{0%{border-radius:42% 58% 70% 30% / 45% 45% 55% 55%}50%{border-radius:70% 30% 46% 54% / 30% 39% 61% 70%}100%{border-radius:100% 60% 60% 100% / 100% 100% 60% 60%}}@keyframes lq-drift{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(28px,-22px) rotate(110deg)}100%{transform:translate(-22px,26px) rotate(220deg)}}
@media (prefers-reduced-motion: reduce){.tara-anim{animation:none !important}}
@keyframes t3-spin{0%{transform:rotateX(-22deg) rotateY(0deg)}100%{transform:rotateX(-22deg) rotateY(360deg)}}@keyframes t3-coin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}@keyframes t3-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes t3-shadow{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(.82);opacity:.22}}@keyframes t3-floor{0%{background-position:0 0}100%{background-position:0 44px}}@keyframes t3-orbit{0%,100%{transform:rotateX(55deg) rotateZ(-35deg)}50%{transform:rotateX(55deg) rotateZ(-27deg)}}@keyframes t3-tilt{0%,100%{transform:perspective(800px) rotateX(9deg) rotateY(-12deg)}50%{transform:perspective(800px) rotateX(4deg) rotateY(9deg)}}@keyframes t3-sheen{0%,30%{background-position:120% 0}70%,100%{background-position:-120% 0}}@keyframes t3-ride{0%{offset-distance:0%}100%{offset-distance:100%}}@keyframes t3-ping{0%{transform:scale(.5);opacity:.8}100%{transform:scale(2.4);opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #2A2018 0%, #14100D 55%, #0A0A0F 100%); color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; left: -60px; top: 460px; width: 520px; height: 160px; background: #3A2C20; transform: rotate(-6deg); filter: blur(6px); opacity: .7" aria-hidden="true"></div>
  <div style="position: absolute; left: 260px; top: 80px; width: 120px; height: 200px; border-radius: 12px; background: #4A3A2A; filter: blur(10px); opacity: .55" aria-hidden="true"></div>

  <div class="tara-anim" style="position: absolute; left: 92px; top: 130px; width: 206px; height: 360px; border-radius: 30px; background: #111014; box-shadow: 7px 7px 0 #2B2931, 0 30px 60px rgba(0,0,0,.6); padding: 10px; box-sizing: border-box; animation: tara-sway 5s ease-in-out infinite" aria-hidden="true">
    <div style="width: 100%; height: 100%; border-radius: 22px; background: #F6F2EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
      <span style="font-size: 10px; font-weight: 800; letter-spacing: .08em; color: rgba(22,18,14,.66)">{{phoneLabel}}</span>
      <span style="position: relative; width: 140px; height: 140px; padding: 8px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF">
        <svg width="124" height="124" viewBox="0 0 84 84"><path d="{{qr}}" fill="#16120E"></path></svg>
        <span style="position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 21px; height: 21px; border-radius: 6px; background: linear-gradient(135deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)"></span></span>
      </span>
      <span style="display: flex; gap: 4px; font: 800 16px Sora, sans-serif; color: #16120E">{{digits}}</span>
    </div>
  </div>

  <button type="button" onClick="{{scan}}" aria-label="{{frameLabel}}" style="position: absolute; left: 70px; top: 190px; width: 250px; height: 250px; border: 0; padding: 0; border-radius: 30px; background: transparent; box-shadow: 0 0 0 999px rgba(6,5,8,.66); cursor: pointer">
    <span class="tara-anim" style="position: absolute; inset: 0; animation: tara-breathe 2.4s ease-in-out infinite" aria-hidden="true">
      <span style="position: absolute; left: 0; top: 0; width: 46px; height: 46px; border-top: 5px solid {{corner}}; border-left: 5px solid {{corner}}; border-radius: 30px 0 0 0; transition: border-color .3s"></span>
      <span style="position: absolute; right: 0; top: 0; width: 46px; height: 46px; border-top: 5px solid {{corner}}; border-right: 5px solid {{corner}}; border-radius: 0 30px 0 0; transition: border-color .3s"></span>
      <span style="position: absolute; left: 0; bottom: 0; width: 46px; height: 46px; border-bottom: 5px solid {{corner}}; border-left: 5px solid {{corner}}; border-radius: 0 0 0 30px; transition: border-color .3s"></span>
      <span style="position: absolute; right: 0; bottom: 0; width: 46px; height: 46px; border-bottom: 5px solid {{corner}}; border-right: 5px solid {{corner}}; border-radius: 0 0 30px 0; transition: border-color .3s"></span>
    </span>
    <sc-if value="{{scanning}}" hint-placeholder-val="{{ true }}">
      <span class="tara-anim" style="position: absolute; left: 18px; right: 18px; top: 14px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,138,0,0) 0%, #FFB000 30%, #FF6A00 70%, rgba(255,61,0,0) 100%); box-shadow: 0 0 18px 4px rgba(255,106,0,.55); animation: tara-scanline 2.2s ease-in-out infinite" aria-hidden="true"></span>
    </sc-if>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px" aria-hidden="true">
        <span class="tara-anim" style="position: absolute; inset: 0; border-radius: 50%; background: rgba(74,222,155,.45); animation: tara-ring 1s ease-out infinite"></span>
        <span class="tara-anim" style="position: absolute; inset: 0; border-radius: 50%; background: #10A06E; box-shadow: 0 12px 30px rgba(16,160,110,.5); display: flex; align-items: center; justify-content: center; animation: tara-pop .45s cubic-bezier(.2,.8,.2,1) both"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      </span>
    </sc-if>
  </button>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 18px 20px 0; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
    <a href="#" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; text-align: center; font-size: 16px; font-weight: 800">{{title}}</h1>
    <button type="button" aria-label="Lampe" aria-pressed="{{torchPressed}}" onClick="{{torch}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{torchInk}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-1 6H9zM9 8h6v3l-2 3v8h-2v-8l-2-3z"></path></svg></button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 462px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <b style="font-size: 16px; color: {{headlineInk}}">{{headline}}</b>
    <span style="padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.14); font-size: 12px; font-weight: 700; color: rgba(255,255,255,.86)">{{context}}</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 24px; border-radius: 28px 28px 0 0; background: rgba(22,22,30,.92); border-top: 1px solid rgba(255,255,255,.10); display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{scanning}}" hint-placeholder-val="{{ true }}">
      <span style="font-size: 13px; line-height: 1.45; color: rgba(255,255,255,.74); text-align: center">{{helper}}</span>
      <button type="button" style="height: 54px; border-radius: 18px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB15C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg>Taper les 4 chiffres</button>
    </sc-if>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
      <span style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800; color: #4ADE9B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ADE9B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{verified}}</span>
      <a href="#" style="height: 58px; border-radius: 20px; background: linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%); box-shadow: 0 14px 30px rgba(255,90,0,.30); display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #140800; font-size: 16px; font-weight: 800">{{next}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#140800" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      <button type="button" onClick="{{reset}}" style="height: 40px; border: 0; background: transparent; color: rgba(255,255,255,.66); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Recommencer la démonstration</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["enlèvement","livraison"],"default":"enlèvement"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ok: false, torch: false };
  }
  renderVals() {
    const delivery = (this.props.mode ?? 'enlèvement') === 'livraison';
    const ok = this.state.ok;
    const n = 21;
    const m = 4;
    let seed = delivery ? 5521 : 4821;
    const rand = () => {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      return seed / 2147483648;
    };
    const finder = (x, y, r, c) => {
      const dx = c - x;
      const dy = r - y;
      if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
      return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
    };
    const near = (x, y, r, c) => c >= x - 1 && c <= x + 7 && r >= y - 1 && r <= y + 7;
    let qr = '';
    for (let r = 0; r < n; r += 1) {
      for (let c = 0; c < n; c += 1) {
        const f = finder(0, 0, r, c) ?? finder(n - 7, 0, r, c) ?? finder(0, n - 7, r, c);
        const dark = f !== null ? f : near(0, 0, r, c) || near(n - 7, 0, r, c) || near(0, n - 7, r, c) ? false : rand() > 0.52;
        if (dark) qr += `M${c * m} ${r * m}h${m}v${m}h-${m}z`;
      }
    }
    return {
      qr,
      ok,
      scanning: !ok,
      title: delivery ? 'Code de livraison' : 'Code d’enlèvement',
      phoneLabel: delivery ? 'CODE DE LIVRAISON · MARIE NGO' : 'CODE D’ENLÈVEMENT · TR-48301',
      digits: delivery ? '5 5 2 1' : '4 8 2 1',
      corner: ok ? '#4ADE9B' : '#FF8A3D',
      frameLabel: ok ? 'Code lu' : 'Lire le code (démonstration)',
      headline: ok ? (delivery ? 'Code bon : colis remis !' : 'Code bon !') : delivery ? 'Visez le code de livraison de Marie' : 'Visez le code d’enlèvement de la boutique',
      headlineInk: ok ? '#4ADE9B' : '#FFFFFF',
      context: delivery ? 'Marie Ngo · Collège des Nations · 15 000 F à encaisser' : 'Boutique Awa · colis n° 4, 9 et 12',
      helper: delivery
        ? 'Son code de livraison s’affiche dans le lien de suivi reçu par SMS. Sans réseau, tapez les chiffres qu’elle vous dit.'
        : 'La boutique l’affiche dans son app, sur l’écran « Commande envoyée ». Ce n’est pas le code QR du reçu : celui-là sert seulement à vérifier un reçu.',
      verified: delivery ? 'Code de livraison vérifié · 15:24' : 'Code d’enlèvement vérifié · 3 colis',
      next: delivery ? 'Continuer : encaisser 15 000 F' : 'Continuer : photo des colis',
      scan: () => this.setState({ ok: true }),
      reset: () => this.setState({ ok: false }),
      torch: () => this.setState({ torch: !this.state.torch }),
      torchPressed: this.state.torch ? 'true' : 'false',
      torchInk: this.state.torch ? '#FFB000' : '#FFFFFF',
    };
  }
}
</script>
</body>
</html>
