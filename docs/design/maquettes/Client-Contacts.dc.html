@keyframes r-radar{0%{transform:scale(.3);opacity:.75}100%{transform:scale(3.2);opacity:0}}@keyframes r-dash{to{stroke-dashoffset:-28}}@keyframes r-blink{0%,100%{opacity:1}50%{opacity:.35}}@keyframes r-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes r-turn{to{transform:rotate(360deg)}}@keyframes r-rise{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}@keyframes r-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes lq-move{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes lq-move-r{from{transform:translateX(-50%)}to{transform:translateX(0)}}@keyframes lq-move-y{from{transform:translateY(0)}to{transform:translateY(-50%)}}@keyframes lq-drain{from{transform:translateY(0%)}to{transform:translateY(100%)}}@keyframes lq-up{from{transform:translateY(100%)}to{transform:translateY(0%)}}@keyframes lq-fill-x{0%{width:0%}85%,100%{width:100%}}@keyframes lq-flow{from{background-position:0% 0}to{background-position:-200% 0}}@keyframes lq-morph{0%{border-radius:42% 58% 70% 30% / 45% 45% 55% 55%}50%{border-radius:70% 30% 46% 54% / 30% 39% 61% 70%}100%{border-radius:100% 60% 60% 100% / 100% 100% 60% 60%}}@keyframes lq-drift{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(28px,-22px) rotate(110deg)}100%{transform:translate(-22px,26px) rotate(220deg)}}
@keyframes am-rise{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}@keyframes am-blink{0%,49%{opacity:1}50%,100%{opacity:0}}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; position: relative; overflow: hidden; {{themeVars}}">

<div style="position: relative; padding: 18px 20px 0; display: flex; align-items: center; gap: 10px"><a href="Client-Liste-Envoi.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: inherit; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="font-family: Sora, sans-serif; font-size: 18px">Choisir des clients</b><span style="font-size: 12px; color: rgba(var(--fg-rgb),.70)">Cochez ceux à livrer aujourd’hui</span></span></div>
<div style="position: absolute; left: 20px; right: 20px; top: 92px; bottom: 110px; display: flex; flex-direction: column; gap: 10px; overflow: hidden"><label style="min-height: 56px; padding: 8px 14px; border-radius: 16px; background: var(--card); border: 1px solid rgba(var(--fg-rgb),.14); display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; flex-direction: row; align-items: center; gap: 10px"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 700; color: rgba(var(--fg-rgb),.62)">Rechercher</span><b style="font-size: 16px">Nom ou numéro</b></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(var(--fg-rgb),.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg></label><span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--accent)">VOS CLIENTS · ADRESSE DÉJÀ CONNUE</span><sc-for list="{{known}}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{k.toggle}}" style="min-height: 54px; padding: 8px 12px; border-radius: 16px; border: 1px solid {{k.border}}; background: var(--card); color: inherit; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer"><span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 8px; border: 2px solid {{k.box}}; background: {{k.fill}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #140800"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14px">{{k.name}}</b><span style="font-size: 12px; color: rgba(var(--fg-rgb),.62)">{{k.sub}}</span></span></button></sc-for><span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--accent)">CONTACTS DU TÉLÉPHONE</span><sc-for list="{{phone}}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{k.toggle}}" style="min-height: 50px; padding: 8px 12px; border-radius: 16px; border: 1px solid {{k.border}}; background: var(--card); color: inherit; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer"><span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 8px; border: 2px solid {{k.box}}; background: {{k.fill}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #140800"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14px">{{k.name}}</b><span style="font-size: 12px; color: rgba(var(--fg-rgb),.62)">{{k.sub}}</span></span></button></sc-for><span style="font-size: 11px; line-height: 1.5; color: rgba(var(--fg-rgb),.55)">Seuls les clients cochés quittent votre téléphone. Pour ceux sans adresse, Tara leur envoie un lien pour placer leur point.</span></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: rgba(var(--bg-rgb),var(--glass-a, .62)); border-top: 1px solid rgba(var(--fg-rgb),.08); display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); background-image: linear-gradient(180deg, var(--glass-hi, rgba(255, 255, 255, .4)) 0%, rgba(255, 255, 255, 0) 70%); box-shadow: inset 0 1px 0 var(--glass-edge, rgba(255, 255, 255, .5)), 0 16px 36px rgba(0, 0, 0, .16)"><button type="button" style="height: 58px; border: 0; border-radius: 20px; background: linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%); color: #140800; font-size: 16px; font-weight: 800">{{addLabel}}</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "clair"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: [0, 2, 11] };
  }
  vals() {
    const sel = this.state.sel;
    const make = (list, offset) => list.map(([name, sub], i) => {
      const id = offset + i; const on = sel.includes(id);
      return { name, sub, border: on ? '#FF8A00' : 'var(--card-border)', box: on ? '#FF8A00' : 'rgba(var(--fg-rgb),.35)',
        fill: on ? 'linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)' : 'transparent',
        toggle: () => this.setState({ sel: on ? sel.filter((x) => x !== id) : [...sel, id] }) };
    });
    return {
      known: make([['Marie Ngo', 'Collège des Nations · 4 commandes'], ['Paul Ekane', 'Rue Joss · 2 commandes'], ['Linda Mbappé', 'Carrefour Yassa · 1 commande']], 0),
      phone: make([['Arnaud Tchami', '6 70 •• •• 18'], ['Grâce Ndoumbe', '6 55 •• •• 02'], ['Hervé Ngando', '6 99 •• •• 47']], 10),
      addLabel: sel.length ? `Ajouter ${sel.length} client${sel.length > 1 ? 's' : ''}` : 'Cochez des clients',
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'clair';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
