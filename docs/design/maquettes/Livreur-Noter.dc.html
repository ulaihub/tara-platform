 border-box; background: #8A5A2E; transform: rotateX(-90deg) translateZ(35.0px)"></div></div></div><div role="radiogroup" aria-label="Note" style="display: flex; justify-content: center; gap: 8px"><sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.aria}}" onClick="{{s.pick}}" style="width: 52px; height: 52px; border: 0; padding: 0; background: transparent; cursor: pointer; perspective: 200px"><span class="tara-anim" style="display: block; font-size: 42px; line-height: 52px; color: {{s.color}}; text-shadow: {{s.glow}}; animation: {{s.anim}}">★</span></button></sc-for></div><span style="text-align: center; font-size: 15px; font-weight: 800; color: var(--accent-2)">{{mood}}</span><div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px"><sc-for list="{{tags}}" as="t" hint-placeholder-count="4"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer">{{t.label}}</button></sc-for></div><sc-if value="{{sent}}" hint-placeholder-val="{{ false }}"><div class="tara-anim" style="padding: 14px; border-radius: 20px; background: rgba(14,127,87,.16); border: 1px solid rgba(74,222,155,.45); display: flex; gap: 12px; align-items: flex-start; animation: r-rise .4s ease-out both"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #10A06E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">{{doneTitle}}< <script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "sombre"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 4, picked: ['Colis prêt à temps'], sent: false };
  }
  vals() {

    const btn = (enabled, label, onClick) => ({
      label, onClick,
      bg: enabled ? 'linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)' : 'rgba(var(--fg-rgb),.08)',
      ink: enabled ? '#140800' : 'rgba(var(--fg-rgb),.42)',
    });
    const { rating, picked, sent } = this.state;
    const moods = ['', 'Très difficile', 'Difficile', 'Correct', 'Bien', 'Excellent'];
    const good = ['Colis prêt à temps', 'Bien emballé', 'Accueil aimable', 'Adresse précise'];
    const bad = ['Attente longue', 'Colis mal emballé', 'Injoignable', 'Adresse imprécise'];
    const list = rating >= 4 || rating === 0 ? good : bad;
    return {
      stars: [1, 2, 3, 4, 5].map((n) => ({
        checked: n === rating ? 'true' : 'false',
        aria: `${n} étoile${n > 1 ? 's' : ''}`,
        color: n <= rating ? '#FFB000' : 'rgba(var(--fg-rgb),.18)',
        glow: n <= rating ? '0 0 18px rgba(255,138,0,.6)' : 'none',
        anim: n <= rating ? `r-star .6s cubic-bezier(.2,.8,.2,1) ${(n - 1) * 0.06}s both` : 'none',
        pick: () => this.setState({ rating: n, picked: [] }),
      })),
      mood: rating ? moods[rating] : 'Touchez une étoile',
      tags: list.map((label) => {
        const on = picked.includes(label);
        return {
          label, pressed: on ? 'true' : 'false',
          border: on ? '#FF8A00' : 'rgba(var(--fg-rgb),.16)',
          bg: on ? 'rgba(255,138,0,.14)' : 'rgba(var(--fg-rgb),.05)',
          toggle: () => this.setState({ picked: on ? picked.filter((p) => p !== label) : [...picked, label] }),
        };
      }),
      sent,
      doneTitle: 'Merci !',
      doneBody: 'Votre note aide Tara à bien choisir ses clients.',
      act: sent ? btn(false, 'Note envoyée', () => {}) : btn(rating > 0, 'Envoyer ma note', () => { if (rating) this.setState({ sent: true }); }),
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'sombre';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
