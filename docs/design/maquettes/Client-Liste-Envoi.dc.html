<div style="position: relative; padding: 18px 20px 0; display: flex; align-items: center; gap: 10px"><a href="Accueil.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: inherit; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="font-family: Sora, sans-serif; font-size: 18px">Liste d’envoi</b><span style="font-size: 12px; color: rgba(var(--fg-rgb),.70)">12 clients · jusqu’à 100</span></span><a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 800">Vider</a></div>
<div style="position: absolute; left: 20px; right: 20px; top: 92px; bottom: 110px; display: flex; flex-direction: column; gap: 10px; overflow: hidden"><div style="padding: 10px 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--card-border); box-shadow: 0 12px 28px rgba(140,70,10,.08); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px"><span style="display: flex; flex-direction: column"><span style="color: rgba(var(--fg-rgb),.6)">Départ</span><b>Boutique Awa</b></span><span style="display: flex; flex-direction: column"><span style="color: rgba(var(--fg-rgb),.6)">Quand</span><b>Dès que possible</b></span><span style="display: flex; flex-direction: column"><span style="color: rgba(var(--fg-rgb),.6)">Taille</span><b>M · ≤ 5 kg</b></span></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><a href="Client-Coller-Liste.dc.html" style="min-height: 64px; border-radius: 18px; background: var(--card); border: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: inherit; font-size: 12px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--accent)"><rect x="6" y="4" width="12" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 10h6M9 14h6"></path></svg>Coller</a><a href="Client-Contacts.dc.html" style="min-height: 64px; border-radius: 18px; background: var(--card); border: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: inherit; font-size: 12px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--accent)"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 19c.8-3 3.2-4.6 6-4.6s5.2 1.6 6 4.6M16 4.5a3 3 0 0 1 0 6M21 19c-.4-1.8-1.4-3.1-2.8-3.8"></path></svg>Contacts</a><a href="#" style="min-height: 64px; border-radius: 18px; background: var(--card); border: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: inherit; font-size: 12px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--accent)"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Saisir</a></div><sc-for list="{{lines}}" as="l" hint-placeholder-count="6"><div style="padding: 10px 12px; border-radius: 22px; background: var(--card); border: 1px solid var(--card-border); box-shadow: 0 12px 28px rgba(140,70,10,.08); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); display: flex; align-items: center; gap: 10px"><span style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 10px; background: rgba(255,177,92,.14); color: var(--accent); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{l.n}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><b style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.name}}</b><span style="font-size: 11px; color: {{l.ink}}">{{l.sub}}</span></span><b style="font-size: 13px">{{l.amount}}</b></div></sc-for></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: rgba(var(--bg-rgb),var(--glass-a, .62)); border-top: 1px solid rgba(var(--fg-rgb),.08); display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); background-image: linear-gradient(180deg, var(--glass-hi, rgba(255, 255, 255, .4)) 0%, rgba(255, 255, 255, 0) 70%); box-shadow: inset 0 1px 0 var(--glass-edge, rgba(255, 255, 255, .5)), 0 16px 36px rgba(0, 0, 0, .16)"><a href="Client-Verifier-Envoyer.dc.html" style="height: 58px; border-radius: 20px; background: linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%); box-shadow: 0 14px 30px rgba(255,90,0,.3); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #140800; font-size: 16px; font-weight: 800">Vérifier et envoyer · 11 colis</a></div>

<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "clair"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  vals() {
    const L = (n, name, sub, ink, amount) => ({ n, name, sub, ink, amount });
    return { lines: [
      L('1', 'Marie Ngo', 'Collège des Nations ✓', 'var(--ok)', '15 000 F'),
      L('2', 'Paul Ekane', 'Rue Joss ✓', 'var(--ok)', 'payé'),
      L('3', 'Chantal Eyike', 'Tara lui enverra un lien pour placer son point', 'var(--accent)', '8 500 F'),
      L('4', 'Samuel Etoa', 'Rond-point Deïdo ✓', 'var(--ok)', '12 000 F'),
      L('5', 'Brice Kamga', 'À compléter : numéro incomplet (8 chiffres)', '#FF8A3D', '9 000 F'),
      L('6', 'Linda Mbappé', 'Carrefour Yassa ✓', 'var(--ok)', '22 500 F'),
    ] };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'clair';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
