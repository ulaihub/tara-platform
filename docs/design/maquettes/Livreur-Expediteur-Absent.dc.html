<div style="position: absolute; left: 20px; right: 20px; top: 300px; bottom: 20px; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; text-align: center; font-size: 14px; line-height: 1.5; color: rgba(var(--fg-rgb),.82)">{{lead}}</p><div style="padding: 12px 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--card-border); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); display: flex; flex-direction: column; gap: 8px"><span style="font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--accent)">APPELS À L’EXPÉDITEUR</span><sc-for list="{{calls}}" as="c" hint-placeholder-count="2"><span style="display: flex; justify-content: space-between; font-size: 13px"><span>{{c.label}}</span><span style="color: rgba(var(--fg-rgb),.62)">{{c.result}}</span></span></sc-for><button type="button" onClick="{{call}}" style="min-height: 46px; border-radius: 14px; border: 1px solid rgba(74,222,155,.4); background: rgba(74,222,155,.10); color: var(--ok); font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ok)"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>{{callLabel}}</button></div><sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}"><span style="padding: 12px 14px; border-radius: 16px; background: rgba(255,177,92,.12); border: 1px solid rgba(255,177,92,.35); font-size: 13px; line-height: 1.45">La course sera annulée. L’expéditeur paiera 700 F, dont 480 F pour vous. Touchez encore pour confirmer.</span></sc-if><sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><div class="tara-anim" style="padding: 14px; border-radius: 20px; background: rgba(14,1 <script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "sombre"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { waited: 22, calls: 1, confirming: false, done: false };
  }
  vals() {

    const btn = (enabled, label, onClick) => ({
      label, onClick,
      bg: enabled ? 'linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%)' : 'rgba(var(--fg-rgb),.08)',
      ink: enabled ? '#140800' : 'rgba(var(--fg-rgb),.42)',
    });
    const { waited, calls, confirming, done } = this.state;
    const left = Math.max(0, 30 - waited);
    const canLeave = left === 0 && calls >= 2;
    const callRows = Array.from({ length: calls }, (_, i) => ({ label: `Appel ${i + 1} · 14:${52 + i * 6}`, result: 'pas de réponse' }));
    let lead;
    if (done) lead = 'Vous pouvez reprendre des courses.';
    else if (left > 0) lead = `Il ne vient pas ? Dans ${left} min, vous pourrez partir : 480 F pour vous.`;
    else if (calls < 2) lead = `Appelez d’abord l’expéditeur (encore ${2 - calls} appel) avec le bouton d’appel.`;
    else lead = 'Vous pouvez partir : la course sera annulée et votre attente payée.';
    return {
      minutes: `${waited} min`,
      lvl: `${((1 - Math.min(30, waited) / 30) * 100).toFixed(1)}%`,
      lead,
      calls: callRows,
      call: () => this.setState({ calls: Math.min(2, calls + 1) }),
      callLabel: calls >= 2 ? 'Rappeler' : 'Appeler l’expéditeur',
      confirming: confirming && !done,
      done,
      doneTitle: 'Course annulée',
      doneBody: 'Votre attente vous est payée : 480 F ajoutés à vos gains.',
      act: done ? btn(false, 'Course annulée', () => {}) : btn(canLeave, confirming ? 'Confirmer : partir' : 'L’expéditeur ne vient pas', () => {
        if (!canLeave) return;
        if (confirming) this.setState({ done: true });
        else this.setState({ confirming: true });
      }),
      skip: () => this.setState({ waited: waited >= 30 ? 22 : 30, confirming: false, done: false }),
      skipLabel: waited >= 30 ? 'revenir à 22 min' : 'avancer à 30 min',
    };
  }
  renderVals() {
    const THEMES = {"sombre": "--bg: #0A0A0F; --bg-rgb: 10,10,15; --ink: #FFFFFF; --fg-rgb: 255,255,255; --sheet: #16161E; --panel-rgb: 22,22,30; --lq-back: rgba(255,61,0,.5); --glass-hi: rgba(255,255,255,.10); --glass-edge: rgba(255,255,255,.14); --inv: #FFFFFF; --inv-ink: #16120E; --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10); --accent: #FFB15C; --accent-2: #FFC283; --ok: #4ADE9B; --danger: #FF4D5A; --danger-rgb: 255,77,90; --sleep: saturate(.35) brightness(.55); --map-bg: #0D0E13; --map-rgb: 13,14,19; --map-ground: #111219; --road-1: #252833; --road-2: #1E2029; --water: #0F1922; --b1: #1B1D25; --b2: #15161D; --b3: #20222C; --b4: #17181F; --b5: #272A35", "clair": "--bg: #F6F2EC; --bg-rgb: 246,242,236; --ink: #16120E; --fg-rgb: 22,18,14; --sheet: #FFFFFF; --panel-rgb: 255,255,255; --lq-back: rgba(255,106,0,.35); --glass-hi: rgba(255,255,255,.55); --glass-edge: rgba(255,255,255,.9); --inv: #16120E; --inv-ink: #FFFFFF; --card: rgba(255,255,255,.84); --card-border: #FFFFFF; --accent: #C2410C; --accent-2: #9A3412; --ok: #0E7F57; --danger: #E5252F; --danger-rgb: 229,37,47; --sleep: saturate(.25) brightness(1.02) contrast(.92); --map-bg: #EFE8DE; --map-rgb: 239,232,222; --map-ground: #E7DED2; --road-1: #FFFFFF; --road-2: #FBF7F1; --water: #BCD7E4; --b1: #E6D9CA; --b2: #DCCDBC; --b3: #EFE4D7; --b4: #D6C6B4; --b5: #FFFFFF"};
    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'sombre';
    const t = pick === 'clair' ? 'clair' : 'sombre';
    const G = { verre: '.38', equilibre: '.62', opaque: '.9' };
    const g = G[(this.state && this.state.glass) || this.props.glass || 'equilibre'] || '.62';
    return { ...this.vals(), themeVars: THEMES[t] + `; --glass-a: ${g}` };
  }
}
</script>
