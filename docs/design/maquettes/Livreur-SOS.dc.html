<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["sombre", "clair"], "default": "sombre"}, "glass": {"editor": "enum", "options": ["verre", "equilibre", "opaque"], "default": "equilibre"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { s: 'idle' };
  }
  vals() {
    const s = this.state.s;
    const leads = {
      idle: 'Maintenez le bouton 3 secondes. L’équipe Tara et votre contact d’urgence reçoivent votre position en direct.',
      holding: 'Gardez le doigt appuyé… (maquette : touchez encore pour envoyer)',
      sent: 'Alerte envoyée. Restez en lieu sûr si possible. Un agent Tara vous rappelle.',
      ack: 'Un agent Tara a pris en charge votre alerte et vous rappelle. Restez en lieu sûr si possible.',
    };
    const next = { idle: 'holding', holding: 'sent', sent: 'ack', ack: 'idle' };
    return {
      lead: leads[s],
      press: () => this.setState({ s: next[s] }),
      pressLabel: 'Maintenir 3 secondes pour envoyer une alerte',
      filling: s === 'holding', full: s === 'sent' || s === 'ack',
      sosInk: s === 'idle' ? '#FF6B75' : '#FFF',
      holdText: s === 'idle' ? 'Maintenir 3 s' : s === 'holding' ? 'Encore 2 s…' : s === 'sent' ? 'Envoyée' : 'Prise en charge',
      posText: s === 'sent' || s === 'ack' ? 'Partagée en direct avec Tara · précision 12 m' : 'Position actuelle · précision 12 m',
      canCancel: s === 'sent' || s === 'ack',
      cancel: () => this.setState({ s: 'idle' }),
    };
  }
  renderVals() {

    const pick = (this.state && this.state.themeOverride) || this.props.theme || 'sombre';
