<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tara Livreur · Inscription (clair)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F2EC}
a{color:#C2410C}a:hover{color:#9A3412}
button,input,select{font-family:inherit}
input::placeholder{color:rgba(22,18,14,.5)}
:focus-visible{outline:2px solid #C2410C;outline-offset:3px}
@keyframes morph{0%,100%{border-radius:42% 58% 70% 30%/45% 45% 55% 55%}33%{border-radius:70% 30% 46% 54%/30% 29% 71% 70%}66%{border-radius:100% 60% 60% 100%/100% 100% 60% 60%}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-32px) scale(1.12)}}
@keyframes sheen{0%{transform:translateX(-140%) skewX(-20deg)}55%,100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes flow{to{background-position:200% 0}}
.blob{animation:morph 14s ease-in-out infinite,drift 20s ease-in-out infinite}
.sheen{animation:sheen 3.6s ease-in-out infinite}
.flow{background-size:200% 100%;animation:flow 2.6s linear infinite}
[data-motion=off] *{animation:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div data-motion="{{motion}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F2EC; color: #16120E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div aria-hidden="true" class="blob" style="position: absolute; top: -140px; right: -150px; width: 340px; height: 340px; background: radial-gradient(circle at 30% 30%, #FFB000 0%, #FF6A00 55%, #FF3D00 100%); filter: blur(48px); opacity: 0.45"></div>
  <div aria-hidden="true" class="blob" style="position: absolute; bottom: -160px; left: -140px; width: 320px; height: 320px; background: radial-gradient(circle, #FFD27A, #FF8A00); filter: blur(60px); opacity: 0.4; animation-delay: -8s"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 60px 24px 36px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 14px">
      <a href="CodeSMSClair.dc.html" aria-label="Retour" style="flex: none; width: 44px; height: 44px; border-radius: 15px; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 6px 16px rgba(140,70,10,0.08); color: #16120E; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: rgba(22,18,14,0.7)"><span>Étape 1 sur 2 · Profil</span><span>50 %</span></div>
        <div role="progressbar" aria-label="Progression de l'inscription" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="height: 8px; border-radius: 8px; background: rgba(22,18,14,0.08); overflow: hidden">
          <div class="flow" style="width: 50%; height: 100%; border-radius: 8px; background-image: linear-gradient(90deg, #FFB000, #FF6A00, #FF3D00, #FF6A00, #FFB000)"></div>
        </div>
      </div>
    </div>

    <h1 style="margin: 28px 0 6px; font-family: 'Sora', sans-serif; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em">Devenez livreur Tara</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: rgba(22,18,14,0.7)">Quelques infos pour créer votre profil. Tout est vérifié avant votre première course.</p>

    <div style="margin-top: 20px; padding: 18px; border-radius: 26px; background: rgba(255,255,255,0.58); border: 1px solid rgba(255,255,255,0.95); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 #FFFFFF, 0 20px 40px rgba(140,70,10,0.10); display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="prenom" style="font-size: 12px; font-weight: 600; color: rgba(22,18,14,0.7)">Prénom</label>
          <input id="prenom" autocomplete="given-name" defaultValue="Koffi" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(22,18,14,0.10); background: #FFFFFF; color: #16120E; font-size: 15px; font-weight: 600">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="nom" style="font-size: 12px; font-weight: 600; color: rgba(22,18,14,0.7)">Nom</label>
          <input id="nom" autocomplete="family-name" defaultValue="Yao" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(22,18,14,0.10); background: #FFFFFF; color: #16120E; font-size: 15px; font-weight: 600">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="vehicule-label" style="font-size: 12px; font-weight: 600; color: rgba(22,18,14,0.7)">Véhicule</span>
        <div role="radiogroup" aria-labelledby="vehicule-label" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{vehicles}}" as="v" hint-placeholder-count="4">
            <button type="button" role="radio" aria-checked="{{v.checked}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="plaque" style="font-size: 12px; font-weight: 600; color: rgba(22,18,14,0.7)">Immatriculation</label>
        <input id="plaque" placeholder="Ex. 1234 AB 01" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1.5px solid #FF8A3D; background: #FFFFFF; color: #16120E; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; box-shadow: 0 0 0 4px rgba(255,106,0,0.12)">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="urgence" style="font-size: 12px; font-weight: 600; color: rgba(22,18,14,0.7)">Contact d'urgence</label>
        <input id="urgence" type="tel" placeholder="Nom et numéro d'un proche" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(22,18,14,0.10); background: #FFFFFF; color: #16120E; font-size: 15px">
        <p style="margin: 2px 0 0; font-size: 12px; line-height: 1.4; color: rgba(22,18,14,0.66)">Prévenu automatiquement si vous déclenchez une alerte.</p>
      </div>
    </div>

    <a href="PiecesClair.dc.html" style="margin-top: auto; position: relative; overflow: hidden; height: 58px; border-radius: 20px; background: linear-gradient(100deg, #FFB000 0%, #FF6A00 55%, #FF3D00 100%); color: #140800; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 14px 30px rgba(255,90,0,0.32), inset 0 1px 0 rgba(255,255,255,0.5)">
      <span aria-hidden="true" class="sheen" style="position: absolute; top: 0; left: 0; width: 70px; height: 100%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.6), rgba(255,255,255,0))"></span>
      <span style="position: relative">Continuer</span>
      <svg aria-hidden="true" style="position: relative" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true,"section":"Effets"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { vehicle: 'moto' };
  }
  renderVals() {
    const base = 'height: 46px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; ';
    const on = base + 'border: 1.5px solid #FF8A3D; background: linear-gradient(160deg, rgba(255,176,0,0.28), rgba(255,106,0,0.18)); color: #16120E; box-shadow: 0 8px 18px rgba(255,90,0,0.18), inset 0 1px 0 rgba(255,255,255,0.7)';
    const off = base + 'border: 1px solid rgba(22,18,14,0.10); background: rgba(255,255,255,0.7); color: rgba(22,18,14,0.75)';
    const list = [
      { id: 'moto', label: 'Moto' },
      { id: 'velo', label: 'Vélo' },
      { id: 'voiture', label: 'Voiture' },
      { id: 'tricycle', label: 'Tricycle' }
    ];
    return {
      motion: this.props.motion === false ? 'off' : 'on',
      vehicles: list.map((v) => ({
        ...v,
        checked: this.state.vehicle === v.id ? 'true' : 'false',
        style: this.state.vehicle === v.id ? on : off,
        pick: () => this.setState({ vehicle: v.id })
      }))
    };
  }
}
</script>
</body>
</html>
