# Services de développement local.
#   pnpm infra:up      → PostgreSQL + PostGIS et Redis
#   pnpm infra:down    → arrêt (les données sont conservées dans les volumes)
# OSRM (itinéraires) est optionnel : préparer la carte une fois avec
#   ./infra/osrm/prepare.sh
# puis lancer : docker compose -f infra/docker-compose.yml --profile routing up -d

name: tara

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: tara
      POSTGRES_DB: tara
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tara -d tara']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: ['routing']
    command: ['osrm-routed', '--algorithm', 'mld', '/data/cameroon-latest.osrm']
    ports:
      - '5000:5000'
    volumes:
      - ./osrm/data:/data

volumes:
  pgdata:
  redisdata:
