# Production de Tara sur un seul serveur (VPS Hostinger, Ubuntu 24.04).
# Installé et piloté par la commande `tara` (infra/production/tara) : ne pas lancer à la main.
#
# Seul Caddy est joignable depuis Internet (ports 80 et 443, HTTPS automatique). Base de
# données, Redis, stockage des fichiers et itinéraires restent sur le réseau interne.
# Secrets (lisibles par root seulement), créés à l'installation : /opt/tara/compose.env pour
# les mots de passe internes, /opt/tara/api.env pour ce que l'API seule doit connaître.

name: tara

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: tara
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init/99-remove-unused-extensions.sql:/docker-entrypoint-initdb.d/99-remove-unused-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tara -d tara']
      interval: 5s
      timeout: 5s
      retries: 30

  # Comptes à moindre privilège et droits (avant et après chaque migration).
  db-roles:
    image: postgis/postgis:16-3.4
    profiles: ['outils']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ../postgres/roles.sql:/roles.sql:ro
    command:
      - psql
      - --host=postgres
      - --username=tara
      - --dbname=tara
      - --quiet
      - --set=ON_ERROR_STOP=1
      - --set=app_password=${APP_DB_PASSWORD:?}
      - --set=migrator_password=${MIGRATOR_DB_PASSWORD:?}
      - --file=/roles.sql

  # Migrations, compartiment de fichiers et données de départ.
  migrate:
    build:
      context: ../..
      target: migrate
    image: tara-migrate
    profiles: ['outils']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: tara-fichiers
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Les files de tâches (BullMQ) exigent qu'aucune clé ne soit évincée.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
        '--requirepass',
        '${REDIS_PASSWORD:?}',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  # Itinéraires et distances (carte OpenStreetMap du Cameroun, préparée par `tara osrm`).
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    command: ['osrm-routed', '--algorithm', 'mld', '/data/cameroon-latest.osrm']
    volumes:
      - ${TARA_HOME:-/opt/tara}/osrm:/data:ro

  # Stockage objet compatible S3 (photos, notes vocales, pièces d'identité déjà chiffrées).
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      [
        'server',
        '-dir=/data',
        '-ip=s3',
        '-ip.bind=0.0.0.0',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json',
      ]
    volumes:
      - s3data:/data
      - ${TARA_HOME:-/opt/tara}/s3.json:/etc/seaweedfs/s3.json:ro

  api:
    build:
      context: ../..
      target: api
    image: tara-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Clés des prestataires (SMS, notifications, paiement, analyse des photos) : `tara config`.
    env_file: ${TARA_HOME:-/opt/tara}/api.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://tara_app:${APP_DB_PASSWORD:?}@postgres:5432/tara
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      OSRM_URL: http://osrm:5000
      PUBLIC_WEB_URL: https://suivi.${TARA_DOMAIN:?}
      PUBLIC_API_URL: https://api.${TARA_DOMAIN:?}
      CORS_ORIGINS: https://admin.${TARA_DOMAIN:?}
      # Une seule couche devant l'API : le proxy Caddy.
      TRUST_PROXY: '1'
      JOBS_ENABLED: 'true'
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: tara-fichiers
      S3_FORCE_PATH_STYLE: 'true'

  backoffice:
    build:
      context: ../..
      target: backoffice
    image: tara-backoffice
    restart: unless-stopped
    depends_on: [api]
    environment:
      TARA_API_URL: http://api:3000
      SESSION_SECRET: ${SESSION_SECRET:?}
      TRUST_PROXY: 'true'

  tracking:
    build:
      context: ../..
      target: tracking
    image: tara-tracking
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:3000
      TRUST_PROXY: 'true'

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [api, backoffice, tracking]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      TARA_DOMAIN: ${TARA_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      APK_USER: testeur
      APK_PASSWORD_HASH: ${APK_PASSWORD_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${TARA_HOME:-/opt/tara}/apk:/srv/apk:ro

volumes:
  pgdata:
  redisdata:
  s3data:
  caddy_data:
  caddy_config:
