name: tara_rider
description: "Tara Livreur : application des livreurs Tara (Cameroun)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_info_plus: ^13.3.0
  intl: ^0.20.3
  path_parsing: ^1.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.4.3
  package_info_plus: ^10.2.2
  socket_io_client: ^3.1.6
  geolocator: ^14.0.1
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  maplibre_gl: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/map/

  # Polices embarquées (licence OFL) : l'app fonctionne sans connexion.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
