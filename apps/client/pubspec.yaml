name: tara_client
description: "Tara : application des expéditeurs, particuliers et marchands (Cameroun)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  tara_core:
    path: ../../packages/tara_core
  tara_ui:
    path: ../../packages/tara_ui
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tara_test:
    path: ../../packages/tara_test

flutter:
  uses-material-design: true
  generate: true
