name: tara_client
description: "Tara : application des expéditeurs, particuliers et marchands (Cameroun)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  dio: ^5.11.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  maplibre_gl: ^0.28.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  record: ^7.1.2
  share_plus: ^13.3.1
  tara_core:
    path: ../../packages/tara_core
  tara_map:
    path: ../../packages/tara_map
  tara_ui:
    path: ../../packages/tara_ui
  tara_sms:
    path: ../../packages/tara_sms
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tara_test:
    path: ../../packages/tara_test

flutter:
  uses-material-design: true
  generate: true
