name: tara_core
description: "Cœur partagé par les apps Tara : client de l'API, session chiffrée, connexion par code SMS, temps réel, notifications, état du réseau, numéros camerounais."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
