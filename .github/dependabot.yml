# Mises à jour automatiques des dépendances : une pull request par mois et par groupe,
# validée par la CI comme toute autre modification (moins de minutes GitHub Actions
# consommées). Les alertes de sécurité sont traitées en priorité par GitHub, en dehors de
# ce calendrier.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      developpement:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pub
    directory: /apps/rider
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
