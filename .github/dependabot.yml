# Mises à jour automatiques des dépendances : une pull request par mois et par groupe,
# validée par la CI comme toute autre modification (moins de minutes GitHub Actions
# consommées). Les alertes de sécurité sont traitées en priorité par GitHub, en dehors de
# ce calendrier.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Le serveur tourne sous Node 22 : ses types doivent rester ceux de Node 22.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 n'a pas encore l'API de compilation dont NestJS a besoin (attendue en 7.1).
      - dependency-name: typescript
        versions: ['7.0.x']
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      developpement:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pub
    directory: /apps/rider
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
