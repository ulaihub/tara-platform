name: Aperçus de la carte

# Images des styles de carte sombre et clair, à regarder dans une PR qui modifie un style.
# Seulement dans ce cas, ou sur demande (bouton « Run workflow »).
on:
  pull_request:
    paths:
      - 'packages/tara_map/assets/**'
      - 'apps/rider/tool/map_preview/**'
      - '.github/workflows/map-preview.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux du jeton GitHub pour tous les jobs.
permissions:
  contents: read

jobs:
  map-preview:
    name: Aperçus de la carte (Douala)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Dépend d'un serveur de tuiles public : un aperçu manqué ne bloque pas la PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Pas de pnpm dans ce job : le cache automatique de setup-node est désactivé.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Rendu des styles sombre et clair
        working-directory: apps/rider/tool/map_preview
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node render.mjs ../../build/map-preview

      - uses: actions/upload-artifact@v4
        with:
          name: carte-apercus
          path: apps/rider/build/map-preview/
          retention-days: 14
