name: App expéditeur

# Tests, analyse et captures de l'app expéditeur, seulement quand elle ou un paquet partagé
# change. Chaque exécution consomme des minutes GitHub Actions (quota mensuel du compte).
on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'packages/tara_core/**'
      - 'packages/tara_ui/**'
      - 'packages/tara_map/**'
      - 'packages/tara_test/**'
      - 'apps/rider/tool/apk_report.py'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'apps/client/**'
      - 'packages/tara_core/**'
      - 'packages/tara_ui/**'
      - 'packages/tara_map/**'
      - 'packages/tara_test/**'
      - 'apps/rider/tool/apk_report.py'
      - '.github/workflows/client.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux du jeton GitHub pour tous les jobs.
permissions:
  contents: read

jobs:
  client:
    name: App expéditeur (Flutter)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7

      # Java 21 comme l'app livreur ; dépendances Gradle en cache.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/client/android/*.gradle*
            apps/client/android/app/*.gradle*
            apps/client/android/gradle/wrapper/gradle-wrapper.properties
            apps/client/pubspec.lock

      # Version de Flutter épinglée : les captures de référence en dépendent.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get --enforce-lockfile

      - name: Traductions générées à jour
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze

      - name: Tests et captures de référence
        run: flutter test

      - name: Écarts de captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-golden-failures
          path: apps/client/test/**/failures/
          retention-days: 7

      # Fichiers d'installation : construits seulement à la fusion sur main ou sur demande
      # (bouton « Run workflow »), pas à chaque modification d'une PR. C'est la partie la
      # plus longue (environ 12 minutes par app) et les APK remplissent vite le stockage.
      #
      # Code Dart obscurci ; les symboles gardés à part servent à lire les plantages.
      # Signature par la clé d'envoi si les secrets du dépôt existent, sinon clé de test.
      - name: APK par architecture
        if: github.event_name != 'pull_request'
        env:
          TARA_CLIENT_KEYSTORE_BASE64: ${{ secrets.TARA_CLIENT_KEYSTORE_BASE64 }}
          TARA_CLIENT_KEYSTORE_PASSWORD: ${{ secrets.TARA_CLIENT_KEYSTORE_PASSWORD }}
          TARA_CLIENT_KEY_ALIAS: ${{ secrets.TARA_CLIENT_KEY_ALIAS }}
          TARA_CLIENT_KEY_PASSWORD: ${{ secrets.TARA_CLIENT_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      # Cahier des charges : moins de 25 Mo à télécharger depuis le Play Store et au plus
      # 32 Mo une fois installée (carte comprise). Détail par bibliothèque, code et ressources.
      - name: Poids des APK (téléchargement 25 Mo, installée 32 Mo)
        if: github.event_name != 'pull_request'
        run: >-
          python3 ../rider/tool/apk_report.py --download-max-mo 25 --installed-max-mo 32
          build/app/outputs/flutter-apk/app-*-release.apk

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: tara-apk
          path: apps/client/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: tara-symboles
          path: apps/client/build/symbols/
          retention-days: 14
