name: CI

# Chaque exécution consomme des minutes GitHub Actions (quota mensuel du compte). Ce
# workflow vérifie l'API, le back-office et la page de suivi : il ne tourne pas quand une
# modification ne touche que les apps Flutter, qui ont leurs propres workflows (rider.yml,
# client.yml). Les styles de carte restent surveillés : le back-office les importe.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/rider/**'
      - 'apps/client/**'
      - 'packages/tara_core/**'
      - 'packages/tara_ui/**'
      - 'packages/tara_test/**'
      - 'packages/tara_map/*'
      - 'packages/tara_map/lib/**'
      - 'packages/tara_map/tool/**'
      - '.github/workflows/rider.yml'
      - '.github/workflows/client.yml'
      - '.github/workflows/map-preview.yml'
      - '.github/workflows/secrets.yml'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - 'apps/rider/**'
      - 'apps/client/**'
      - 'packages/tara_core/**'
      - 'packages/tara_ui/**'
      - 'packages/tara_test/**'
      - 'packages/tara_map/*'
      - 'packages/tara_map/lib/**'
      - 'packages/tara_map/tool/**'
      - '.github/workflows/rider.yml'
      - '.github/workflows/client.yml'
      - '.github/workflows/map-preview.yml'
      - '.github/workflows/secrets.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux du jeton GitHub pour tous les jobs.
permissions:
  contents: read

jobs:
  checks:
    name: Qualité, tests et build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tara
          POSTGRES_PASSWORD: tara
          POSTGRES_DB: tara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tara -d tara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Comme en production : migrations par le compte propriétaire, API et tests par le
    # compte restreint (voir infra/postgres/roles.sql). Mots de passe propres à la CI.
    env:
      ADMIN_DATABASE_URL: postgresql://tara:tara@localhost:5432/tara
      MIGRATION_DATABASE_URL: postgresql://tara_migrator:migrator-ci@localhost:5432/tara
      DATABASE_URL: postgresql://tara_app:app-ci@localhost:5432/tara
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Dépendances de production sans vulnérabilité élevée ou critique
        run: pnpm audit --prod --audit-level high

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typage
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Comptes PostgreSQL à moindre privilège
        run: psql "$ADMIN_DATABASE_URL" -q -v ON_ERROR_STOP=1 -v app_password=app-ci -v migrator_password=migrator-ci -f infra/postgres/roles.sql

      - name: Migrations (compte migrateur)
        run: pnpm db:deploy

      - name: Droits sur les tables créées par les migrations
        run: psql "$ADMIN_DATABASE_URL" -q -v ON_ERROR_STOP=1 -v app_password=app-ci -v migrator_password=migrator-ci -f infra/postgres/roles.sql

      - name: Schéma Prisma aligné sur les migrations
        run: pnpm --filter @tara/api db:check

      - name: Tests d'intégration (compte restreint de l'API)
        run: pnpm test:db

      - name: Build
        run: pnpm build

      - name: Contrat OpenAPI à jour
        run: |
          pnpm --filter @tara/api openapi
          git diff --exit-code apps/api/openapi.json

      - name: Types du back-office alignés sur le contrat
        run: |
          pnpm --filter @tara/backoffice api:types
          git diff --exit-code apps/backoffice/src/lib/api-schema.d.ts
