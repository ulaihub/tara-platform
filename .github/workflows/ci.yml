name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux du jeton GitHub pour tous les jobs.
permissions:
  contents: read

jobs:
  checks:
    name: Qualité, tests et build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tara
          POSTGRES_PASSWORD: tara
          POSTGRES_DB: tara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tara -d tara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Comme en production : migrations par le compte propriétaire, API et tests par le
    # compte restreint (voir infra/postgres/roles.sql). Mots de passe propres à la CI.
    env:
      ADMIN_DATABASE_URL: postgresql://tara:tara@localhost:5432/tara
      MIGRATION_DATABASE_URL: postgresql://tara_migrator:migrator-ci@localhost:5432/tara
      DATABASE_URL: postgresql://tara_app:app-ci@localhost:5432/tara
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Dépendances de production sans vulnérabilité élevée ou critique
        run: pnpm audit --prod --audit-level high

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typage
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Comptes PostgreSQL à moindre privilège
        run: psql "$ADMIN_DATABASE_URL" -q -v ON_ERROR_STOP=1 -v app_password=app-ci -v migrator_password=migrator-ci -f infra/postgres/roles.sql

      - name: Migrations (compte migrateur)
        run: pnpm db:deploy

      - name: Droits sur les tables créées par les migrations
        run: psql "$ADMIN_DATABASE_URL" -q -v ON_ERROR_STOP=1 -v app_password=app-ci -v migrator_password=migrator-ci -f infra/postgres/roles.sql

      - name: Schéma Prisma aligné sur les migrations
        run: pnpm --filter @tara/api db:check

      - name: Tests d'intégration (compte restreint de l'API)
        run: pnpm test:db

      - name: Build
        run: pnpm build

      - name: Contrat OpenAPI à jour
        run: |
          pnpm --filter @tara/api openapi
          git diff --exit-code apps/api/openapi.json

  rider:
    name: App livreur (Flutter)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/rider
    steps:
      - uses: actions/checkout@v7

      # Java 21 : exigé par le module MapLibre, pris en charge par le plugin Android
      # Gradle 9. Dépendances Gradle en cache : la construction ne dépend plus de la
      # disponibilité de Maven Central à chaque fois.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/rider/android/*.gradle*
            apps/rider/android/app/*.gradle*
            apps/rider/android/gradle/wrapper/gradle-wrapper.properties
            apps/rider/pubspec.lock

      # Version de Flutter épinglée : les captures de référence en dépendent.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get --enforce-lockfile

      # Design partagé avec l'app expéditeur : mis en forme et analysé comme l'app.
      - name: Paquet partagé tara_ui
        working-directory: packages/tara_ui
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib
          flutter analyze

      - name: Traductions générées à jour
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze

      - name: Tests et captures de référence
        run: flutter test

      - name: Écarts de captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rider-golden-failures
          path: apps/rider/test/**/failures/
          retention-days: 7

      # Code Dart obscurci ; les symboles gardés à part servent à lire les plantages.
      # Signature par la clé d'envoi si les secrets du dépôt existent, sinon clé de test.
      - name: APK par architecture
        env:
          TARA_RIDER_KEYSTORE_BASE64: ${{ secrets.TARA_RIDER_KEYSTORE_BASE64 }}
          TARA_RIDER_KEYSTORE_PASSWORD: ${{ secrets.TARA_RIDER_KEYSTORE_PASSWORD }}
          TARA_RIDER_KEY_ALIAS: ${{ secrets.TARA_RIDER_KEY_ALIAS }}
          TARA_RIDER_KEY_PASSWORD: ${{ secrets.TARA_RIDER_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      # Cahier des charges : moins de 25 Mo à télécharger depuis le Play Store et au plus
      # 32 Mo une fois installée (carte comprise). Détail par bibliothèque, code et ressources.
      - name: Poids des APK (téléchargement 25 Mo, installée 32 Mo)
        run: >-
          python3 tool/apk_report.py --download-max-mo 25 --installed-max-mo 32
          build/app/outputs/flutter-apk/app-*-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tara-livreur-apk
          path: apps/rider/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: tara-livreur-symboles
          path: apps/rider/build/symbols/
          retention-days: 90

  map-preview:
    name: Aperçus de la carte (Douala)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Dépend d'un serveur de tuiles public : un aperçu manqué ne bloque pas la PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Pas de pnpm dans ce job : le cache automatique de setup-node est désactivé.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Rendu des styles sombre et clair
        working-directory: apps/rider/tool/map_preview
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node render.mjs ../../build/map-preview

      - uses: actions/upload-artifact@v4
        with:
          name: carte-apercus
          path: apps/rider/build/map-preview/
          retention-days: 14

  secrets:
    name: Secrets oubliés dans le code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Binaire officiel, version épinglée, empreinte SHA-256 vérifiée avant exécution.
      # Historique complet de la branche testée seulement (HEAD) : sans cela, gitleaks lit
      # aussi les autres branches récupérées, avec une configuration qui n'est pas la leur.
      - name: Gitleaks sur tout l'historique de la branche
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="--full-history HEAD" .
